# Stage 1 of the Let's Encrypt bootstrap (see deploy/SERVER_SETUP.md).
#
# Deliberately does NOT proxy /api or /uploads to app-api. At this stage the
# backend container may not exist yet, and nginx resolves a literal
# `proxy_pass` hostname once at startup — if app-api isn't reachable, nginx
# crashes on boot instead of serving the ACME challenge it's here for.
# Copy this file to active.conf (never symlink it — see SERVER_SETUP.md for
# why) to run this stage, then switch to nginx.https.conf once a certificate
# has been issued.

server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'bootstrapping';
        add_header Content-Type text/plain;
    }
}
