# Stage 2 of the Let's Encrypt bootstrap (see deploy/SERVER_SETUP.md).
#
# Copy this file to active.conf (never symlink it) once a certificate exists
# under /etc/letsencrypt/live/<domain>/, then `docker compose exec frontend
# nginx -s reload`. The frontend service has `depends_on: app-api
# (service_started)` in docker-compose.prod.yml so the literal `proxy_pass`
# hostnames below resolve safely at nginx startup.

server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    # Replace <domain> with the DuckDNS subdomain before deploying.
    ssl_certificate     /etc/letsencrypt/live/<domain>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<domain>/privkey.pem;

    # Matches application.yml's multipart max-file-size/max-request-size
    # (8MB) with headroom so nginx never 413s ahead of the backend's own
    # (JSON-formatted) error response.
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://app-api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Memory-photo images are rendered via plain <img> tags (they can't carry
    # an Authorization header), so this path must be reachable un-proxied by
    # the SPA fallback below.
    location /uploads/ {
        proxy_pass http://app-api:8080/uploads/;
        proxy_set_header Host $host;
    }

    location /actuator/health {
        proxy_pass http://app-api:8080/actuator/health;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
