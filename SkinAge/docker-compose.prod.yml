# =============================================================================
# SkinAge — Production Docker Compose
# =============================================================================
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml logs -f api
#   docker compose -f docker-compose.prod.yml down
# =============================================================================

services:
  # --------------------------------------------------------------------------
  # API service — FastAPI inference server
  # --------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skinage-api
    expose:
      - "8000"
    volumes:
      - ./outputs/models:/app/outputs/models:ro
    env_file:
      - /opt/skinage.env
    environment:
      - SKINAGE_CONFIG_DIR=/app/config
      - SKINAGE_DEVICE=cpu
    networks:
      - skinage-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # --------------------------------------------------------------------------
  # Nginx — TLS termination & reverse proxy
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: skinage-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/active.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot-webroot:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_started
    networks:
      - skinage-net
    restart: unless-stopped

networks:
  skinage-net:
    driver: bridge
