# =============================================================================
# SkinAge — Production Docker Compose
# =============================================================================
# NOTE: This server also runs the "innerderma" project, whose nginx
# (container "innerderma-frontend-1") already owns host ports 80/443 and
# acts as the single reverse proxy for the whole server. SkinAge therefore
# does NOT run its own nginx — it only publishes port 8000 on the host, and
# innerderma's nginx (or the shared nginx config) is responsible for
# proxying https://skinage-api.duckdns.org/ -> http://localhost:8000/.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml logs -f api
#   docker compose -f docker-compose.prod.yml down
# =============================================================================

services:
  # --------------------------------------------------------------------------
  # API service — FastAPI inference server
  # --------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skinage-api
    ports:
      - "8001:8000"   # host 8001 to avoid clashing with other containers on 8000; shared nginx proxies here
    volumes:
      - ./outputs/models:/app/outputs/models:ro
    env_file:
      - /opt/skinage.env
    environment:
      - SKINAGE_CONFIG_DIR=/app/config
      - SKINAGE_DEVICE=cpu
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
